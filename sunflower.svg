<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Terminal with a sunflower that opens and closes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Fira Code', 'Courier New', monospace; white-space: pre; }
    .t { font-size: 15px; fill: #c9d1d9; }
    .y { font-size: 16px; fill: #ffc107; }
    .g { font-size: 16px; fill: #4caf50; }
    .h { font-size: 15px; fill: #ffc107; }
    .f { opacity: 0; }
    .a { animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .f0 { opacity: 1; animation-name: k0; }
    .f1 { animation-name: k1; }
    .f2 { animation-name: k2; }
    @keyframes k0 { 0%, 24.99% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes k1 { 0%, 24.99% { opacity: 0; } 25%, 44.99% { opacity: 1; } 45%, 74.99% { opacity: 0; } 75%, 100% { opacity: 1; } }
    @keyframes k2 { 0%, 44.99% { opacity: 0; } 45%, 74.99% { opacity: 1; } 75%, 100% { opacity: 0; } }
    .cur { animation: bl 1s steps(1) infinite; }
    @keyframes bl { 50% { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="638" height="298" rx="10" fill="#0d1117" stroke="#ffc107" stroke-width="1.5"/>
  <rect x="1" y="1" width="638" height="30" rx="10" fill="#1a1200"/>
  <rect x="1" y="20" width="638" height="11" fill="#1a1200"/>
  <circle cx="22" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="62" cy="16" r="5" fill="#27c93f"/>
  <text x="320" y="20" text-anchor="middle" class="t" style="font-size:12px;fill:#8b949e">sugam@sunflower: ~</text>

  <text x="30" y="75" class="t"><tspan style="fill:#ffc107">$</tspan> ./grow.sh</text>
  <text x="30" y="100" class="t" style="fill:#8b949e">&gt; loading sunflower...</text>
  <text x="30" y="125" class="t" style="fill:#8b949e">&gt; sunlight : detected</text>

  <g class="f f0 a">
    <text x="30" y="160" class="h">&gt; state : closed</text>
    <text x="330" y="95" class="y" xml:space="preserve">      .-.      </text>
    <text x="330" y="115" class="y" xml:space="preserve">     (   )     </text>
    <text x="330" y="135" class="y" xml:space="preserve">      '-'      </text>
  </g>
  <g class="f f1 a">
    <text x="30" y="160" class="h">&gt; state : half-open</text>
    <text x="330" y="95" class="y" xml:space="preserve">     .-"-.     </text>
    <text x="330" y="115" class="y" xml:space="preserve">   -(  @  )-   </text>
    <text x="330" y="135" class="y" xml:space="preserve">     '-.-'     </text>
  </g>
  <g class="f f2 a">
    <text x="30" y="160" class="h">&gt; state : in full bloom</text>
    <text x="330" y="55" class="y" xml:space="preserve">  \  \ | /  /  </text>
    <text x="330" y="75" class="y" xml:space="preserve">   .-~~~~~-.   </text>
    <text x="330" y="95" class="y" xml:space="preserve"> -(  (@@@)  )- </text>
    <text x="330" y="115" class="y" xml:space="preserve">   '-~~~~~-'   </text>
    <text x="330" y="135" class="y" xml:space="preserve">  /  / | \  \  </text>
  </g>

  <text x="330" y="155" class="g" xml:space="preserve">       |       </text>
  <text x="330" y="175" class="g" xml:space="preserve">     \ | /     </text>
  <text x="330" y="195" class="g" xml:space="preserve">      \|/      </text>
  <text x="330" y="215" class="g" xml:space="preserve">       |       </text>
  <text x="330" y="235" class="g" xml:space="preserve">       |       </text>

  <text x="30" y="270" class="t"><tspan style="fill:#ffc107">$</tspan> <tspan class="cur" style="fill:#ffc107">_</tspan></text>
</svg>
